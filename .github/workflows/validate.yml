name: Validate portfolio project

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile training pipeline
        run: python -m py_compile src/train_model.py
      - name: Validate JSON artifacts and leakage contract
        run: python tests/validate_project.py
