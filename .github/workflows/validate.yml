name: Validate portfolio project

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Execute integrated analysis notebook
        run: jupyter nbconvert --execute --to notebook --inplace --ExecutePreprocessor.timeout=600 Ecommerce_Conversion_Analytics_Integrated.ipynb
      - name: Execute training notebook
        run: jupyter nbconvert --execute --to notebook --inplace --ExecutePreprocessor.timeout=600 src/train_model.ipynb
      - name: Execute validation notebook
        run: jupyter nbconvert --execute --to notebook --inplace --ExecutePreprocessor.timeout=600 tests/validate_project.ipynb
